<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body style="width: 360px; min-width: 360px; max-width: 360px; height: 536px; min-height: 536px; max-height: 536px; margin: 0; padding: 0; background: #18181c; overflow: hidden;">
  <div class="popup-wrapper" style="width: 360px; height: 536px; min-height: 536px; max-height: 536px; display: flex; flex-direction: column; overflow: hidden; background: #18181c;">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg></span>
        <span data-i18n="extName">Modern Downloader</span>
      </div>
      <div class="status-cluster" role="status" aria-live="polite"><span id="status-indicator" class="status-dot disconnected"></span><span id="status-text" class="status-text">Disconnected</span></div>
    </header>
    <main class="content">
      <section class="primary-task" aria-labelledby="explore-heading">
        <h1 id="explore-heading" data-i18n="exploreVideos">Explore videos</h1>
        <p data-i18n="exploreDescription">Find videos on the open page and send them to the app.</p>
        <button type="button" id="open-feed-btn" class="primary-button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 8 5 4-5 4z"/></svg>
          <span data-i18n="openVideoPanel">Open video panel</span><span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </section>
      <section class="quick-actions" aria-label="Actions">
        <button type="button" id="send-tab-btn" class="quiet-button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h13m-5-5 5 5-5 5"/><path d="M17 4h3v16h-3"/></svg><span data-i18n="sendTab">Send this tab</span></button>
        <button type="button" id="sync-tiktok-btn" class="quiet-button" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7a8 8 0 0 0-14-1M4 3v4h4M4 17a8 8 0 0 0 14 1m2 3v-4h-4"/></svg><span data-i18n="syncTikTok">Sync TikTok collections</span></button>
      </section>
      <section class="recent-section" aria-labelledby="recent-heading"><div class="section-heading"><h2 id="recent-heading" data-i18n="recentDownloads">Recent downloads</h2></div><div id="downloads-list" class="downloads-list" aria-live="polite"><div class="empty-state" data-i18n="noDownloads">No active downloads</div></div></section>
    </main>
    <footer class="footer-settings">
      <div id="connection-msg" class="connection-msg" role="status" aria-live="polite">Offline</div>
      <details class="settings-disclosure"><summary data-i18n="connectionSettings">Connection and preferences</summary><div class="settings-body">
        <div class="settings-grid"><div class="setting-item"><label for="browser-select" data-i18n="browser">Browser</label><select id="browser-select"><option value="auto">Auto</option><option value="firefox">Firefox</option><option value="brave">Brave</option><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="opera">Opera</option><option value="vivaldi">Vivaldi</option></select></div><div class="setting-item"><label for="port-input" data-i18n="port">Port</label><input type="number" id="port-input" value="6969" min="1024" max="65535"></div></div>
        <div class="setting-item"><label for="token-input" data-i18n="token">Token</label><div class="token-input-wrapper"><input type="password" id="token-input" autocomplete="off" placeholder="From app settings"><button type="button" id="toggle-token-btn" class="token-toggle-btn" aria-label="Show token" title="Show token"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <label class="switch-row"><span data-i18n="autoCookies">Auto cookies</span><input type="checkbox" id="cookies-toggle" checked></label><label class="switch-row"><span data-i18n="qualityMenu">Quality menu</span><input type="checkbox" id="quality-toggle" checked></label>
        <button type="button" id="test-connection-btn" class="test-button" data-i18n="testConnection">Test connection</button>
      </div></details>
    </footer>
  </div>
  <script src="browser_api.js"></script><script src="popup.js"></script>
</body>
</html>
