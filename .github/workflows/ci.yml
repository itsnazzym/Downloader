name: CI

on:
  push:
    branches: [main, master]
    # A tag pushed by hand releases that commit. Tags this workflow pushes
    # itself (GITHUB_TOKEN) never start a run, so the main bump releases inline.
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release run halfway (tag pushed, release not yet created).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  # Pinned: Flutter 3.50+ requires Gradle 9 / AGP 9, which this project does not
  # use yet (the Android build failed on "stable" once it moved to 3.50).
  FLUTTER_VERSION: "3.44.8"

jobs:
  # -------------------------------------------------------------
  # Job 1: Analyse du code, Formatage et Tests unitaires
  # -------------------------------------------------------------
  quality:
    name: 🧪 Analyse & Tests
    if: ${{ github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format lib/ test/ tool/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test --coverage --reporter=compact

      - name: Check test coverage
        run: dart run tool/check_coverage.dart --min 30 coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Job 2: Validation et build des extensions navigateur
  # -------------------------------------------------------------
  extensions:
    name: 🧩 Extensions Navigateur
    if: ${{ github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build and synchronize extensions
        run: dart run tool/build_extension.dart

      - name: Verify extension contract and packaged copies
        run: dart run tool/check_extension_contract.dart

      - name: Verify Manifest V3 validity
        run: |
          test -f extension/chrome/manifest.json
          test -f extension/firefox/manifest.json
          grep -q '"manifest_version": 3' extension/chrome/manifest.json
          grep -q '"manifest_version": 3' extension/firefox/manifest.json

      - name: Package Chrome extension ZIP
        run: |
          cd extension/chrome
          zip -r ../../modern_downloader_chrome.zip .
          cd ../..

      - name: Upload extensions artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-extensions
          path: |
            modern_downloader_chrome.zip
            extension/firefox/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Version for binaries (bump only on push to main/master)
  # -------------------------------------------------------------
  version:
    name: 🔢 Resolve version
    if: ${{ github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semver: ${{ steps.resolve.outputs.semver }}
      tag: ${{ steps.resolve.outputs.tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      publish: ${{ steps.resolve.outputs.publish }}
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin || true
          line=$(grep '^version:' pubspec.yaml)
          full="${line#version: }"
          full="${full// /}"
          name="${full%%+*}"
          build="${full#*+}"
          if [[ "$build" == "$name" ]]; then
            build=0
          fi
          IFS=. read -r major minor patch <<< "$name"
          publish=false
          bump=false
          if [[ "$REF_TYPE" == "tag" ]]; then
            # Release the tagged commit as is: the tag names the version.
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $REF_NAME is not vMAJOR.MINOR.PATCH"
              exit 1
            fi
            publish=true
            semver="${REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ) ]] \
            && ! git describe --tags --exact-match --match 'v*' HEAD >/dev/null 2>&1; then
            # (A commit pushed with its own v* tag is released by that tag's run.)
            publish=true
            bump=true
            patch=$((patch + 1))
            build=$((build + 1))
            semver="${major}.${minor}.${patch}"
            while git rev-parse "refs/tags/v${semver}" >/dev/null 2>&1; do
              echo "Tag v${semver} already exists — incrementing"
              patch=$((patch + 1))
              build=$((build + 1))
              semver="${major}.${minor}.${patch}"
            done
          else
            semver="${name}"
          fi
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "tag=v${semver}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "Version: ${semver}+${build} (tag v${semver}, publish=${publish}, bump=${bump})"

  # -------------------------------------------------------------
  # Job 4: Compilation Windows Release & Packaging (Inno Setup + Portable)
  # Skipped on pull requests. Push to main bumps, tags and releases; a pushed
  # v* tag releases that commit; manual dispatch only uploads artifacts
  # (dispatched on a tag ref, it re-releases that tag).
  # -------------------------------------------------------------
  windows:
    name: 🪟 Build Windows Release
    if: ${{ github.event_name != 'pull_request' && (github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    needs: [quality, extensions, version]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Apply version bump (push to main only)
        if: ${{ needs.version.outputs.bump == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          new_version="${{ needs.version.outputs.semver }}+${{ needs.version.outputs.build_number }}"
          sed -i "s/^version: .*/version: ${new_version}/" pubspec.yaml
          echo "Release version: ${new_version} (Tag: ${{ needs.version.outputs.tag }})"
          dart run tool/build_extension.dart --bump-patch --release-tag "${{ needs.version.outputs.tag }}"

      - name: Point the Firefox update manifest at this tag (tag runs)
        if: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.bump != 'true' }}
        run: dart run tool/build_extension.dart --release-tag "${{ needs.version.outputs.tag }}"

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Windows Release
        run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.semver }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Embed browser extensions in Release bundle
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$release/extension" | Out-Null
          Copy-Item -Recurse -Force extension/chrome "$release/extension/chrome"
          Copy-Item -Recurse -Force extension/firefox "$release/extension/firefox"

      - name: Prepare experimental gobird binaries
        shell: pwsh
        run: |
          $releaseBin = "build/windows/x64/runner/Release/bin"
          New-Item -ItemType Directory -Force -Path $releaseBin | Out-Null
          & ".\tool\prepare_gobird.ps1" -OutDir $releaseBin -RepoRoot "."
          Copy-Item -Recurse -Force "third_party/gobird" "$releaseBin/third_party/gobird"

      - name: Prepare Tor Expert Bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseBin = "build/windows/x64/runner/Release/bin"
          & ".\tool\prepare_tor_bundle.ps1" -OutDir $releaseBin -RepoRoot "."

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $zip = "ModernDownloader-Windows-Portable.zip"
          if (-not (Test-Path "build/windows/x64/runner/Release/modern_downloader.exe")) { throw "modern_downloader.exe missing from the Release bundle" }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="${{ needs.version.outputs.tag }}" "installer/setup.iss"
          # setup.iss writes to release/; the steps below expect the repo root.
          Move-Item -Force "release/ModernDownloader-Setup-${{ needs.version.outputs.tag }}.exe" .

      - name: Package Chrome ZIP
        shell: pwsh
        run: |
          $zip = "modern_downloader_chrome.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Push-Location extension/chrome
          Compress-Archive -Path * -DestinationPath "../../$zip" -CompressionLevel Optimal
          Pop-Location

      - name: Package Firefox XPI
        shell: pwsh
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          PUBLISH_RELEASE: ${{ needs.version.outputs.publish }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          function New-UnsignedXpi {
            $dest = Join-Path (Get-Location) "modern_downloader_firefox.xpi"
            if (Test-Path $dest) { Remove-Item $dest -Force }
            Push-Location extension/firefox
            Compress-Archive -Path * -DestinationPath $dest -CompressionLevel Optimal
            Pop-Location
          }
          New-UnsignedXpi
          if ($env:PUBLISH_RELEASE -ne 'true') {
            Write-Host "Skipping AMO signing (not a main push). Unsigned XPI packaged."
            exit 0
          }
          if (-not $env:WEB_EXT_API_KEY -or -not $env:WEB_EXT_API_SECRET) {
            Write-Host "AMO secrets not configured. Using zip XPI package."
            exit 0
          }
          npm install -g web-ext@8
          $artifacts = "signed-xpi"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          & web-ext sign `
            --source-dir extension/firefox `
            --api-key $env:WEB_EXT_API_KEY `
            --api-secret $env:WEB_EXT_API_SECRET `
            --channel unlisted `
            --artifacts-dir $artifacts
          if ($LASTEXITCODE -eq 0) {
            $signed = Get-ChildItem $artifacts -Filter *.xpi -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($signed) {
              Copy-Item $signed.FullName modern_downloader_firefox.xpi -Force
              Write-Host "Using AMO-signed XPI."
            }
          } else {
            Write-Host "AMO signing failed (exit $LASTEXITCODE). Keeping unsigned zip XPI."
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          $files = @(
            "ModernDownloader-Windows-Portable.zip",
            "ModernDownloader-Setup-$tag.exe",
            "modern_downloader_firefox.xpi",
            "modern_downloader_chrome.zip"
          )
          $lines = foreach ($f in $files) {
            if (Test-Path $f) {
              $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              "$hash  $f"
            }
          }
          $lines | Set-Content -Encoding utf8 CHECKSUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            ModernDownloader-Windows-Portable.zip
            ModernDownloader-Setup-${{ needs.version.outputs.tag }}.exe
            modern_downloader_firefox.xpi
            modern_downloader_chrome.zip
            CHECKSUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Commit version bump & Tag
        if: ${{ needs.version.outputs.bump == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml \
            extension/shared/manifest.chrome.json \
            extension/shared/manifest.firefox.json \
            extension/chrome/manifest.json \
            extension/firefox/manifest.json \
            extension_version.json
          git commit -m "chore(release): ${{ needs.version.outputs.tag }}" || true
          git tag "${{ needs.version.outputs.tag }}" || true
          # No "|| true": a release must not be published for a tag that never reached origin.
          git push origin "HEAD:${{ github.ref_name }}" "refs/tags/${{ needs.version.outputs.tag }}"

      - name: Write release notes
        if: ${{ needs.version.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/release_notes.dart > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: ${{ needs.version.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            ModernDownloader-Windows-Portable.zip
            ModernDownloader-Setup-${{ needs.version.outputs.tag }}.exe
            modern_downloader_firefox.xpi
            modern_downloader_chrome.zip
            CHECKSUMS.txt
            extension_version.json

  # -------------------------------------------------------------
  # Job 5: Android release APK (debug-signed if no keystore secrets)
  # -------------------------------------------------------------
  android:
    name: 🤖 Build Android APK
    if: ${{ github.event_name != 'pull_request' && (github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    needs: [quality, extensions, version]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Android APK
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ needs.version.outputs.semver }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Stage APK artifact
        run: |
          set -euo pipefail
          # One APK per CPU type: a phone only needs its own engine copy
          # (about 75 MB instead of 210 MB for the universal APK).
          out="build/app/outputs/flutter-apk"
          test -f "$out/app-arm64-v8a-release.apk"
          test -f "$out/app-armeabi-v7a-release.apk"
          cp "$out/app-arm64-v8a-release.apk" ModernDownloader-Android.apk
          cp "$out/app-armeabi-v7a-release.apk" ModernDownloader-Android-armv7.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            ModernDownloader-Android.apk
            ModernDownloader-Android-armv7.apk
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 6: Attach Android APK to the GitHub Release created on push
  # -------------------------------------------------------------
  attach-android-release:
    name: 📦 Attach Android APK to GitHub Release
    if: ${{ needs.version.outputs.publish == 'true' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/ModernDownloader-Android.apk
            dist/ModernDownloader-Android-armv7.apk

