name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  # -------------------------------------------------------------
  # Job 1: Analyse du code, Formatage et Tests unitaires
  # -------------------------------------------------------------
  quality:
    name: 🧪 Analyse & Tests
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format lib/ test/ tool/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test --coverage --reporter=compact

      - name: Check test coverage
        run: dart run tool/check_coverage.dart --min 30 coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Job 2: Validation et build des extensions navigateur
  # -------------------------------------------------------------
  extensions:
    name: 🧩 Extensions Navigateur
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build and synchronize extensions
        run: dart run tool/build_extension.dart

      - name: Verify extension contract and packaged copies
        run: dart run tool/check_extension_contract.dart

      - name: Verify Manifest V3 validity
        run: |
          test -f extension/chrome/manifest.json
          test -f extension/firefox/manifest.json
          grep -q '"manifest_version": 3' extension/chrome/manifest.json
          grep -q '"manifest_version": 3' extension/firefox/manifest.json

      - name: Package Chrome extension ZIP
        run: |
          cd extension/chrome
          zip -r ../../modern_downloader_chrome.zip .
          cd ../..

      - name: Upload extensions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: |
            modern_downloader_chrome.zip
            extension/firefox/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Compilation Windows Release & Packaging (Inno Setup + Portable)
  # -------------------------------------------------------------
  release:
    name: 🪟 Build & Publish Windows Release
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    needs: [quality, extensions]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Determine & Bump Version (+0.0.1)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin || true
          line=$(grep '^version:' pubspec.yaml)
          full="${line#version: }"
          full="${full// /}"
          name="${full%%+*}"
          build="${full#*+}"
          if [[ "$build" == "$name" ]]; then
            build=0
          fi
          IFS=. read -r major minor patch <<< "$name"
          patch=$((patch + 1))
          build=$((build + 1))
          semver="${major}.${minor}.${patch}"
          while git rev-parse "refs/tags/v${semver}" >/dev/null 2>&1; do
            echo "Tag v${semver} already exists — incrementing"
            patch=$((patch + 1))
            build=$((build + 1))
            semver="${major}.${minor}.${patch}"
          done
          new_version="${semver}+${build}"
          sed -i "s/^version: .*/version: ${new_version}/" pubspec.yaml
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "tag=v${semver}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${new_version} (Tag: v${semver})"
          dart run tool/build_extension.dart --bump-patch --release-tag "v${semver}"

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Windows Release
        run: >
          flutter build windows --release
          --build-name=${{ steps.bump.outputs.semver }}
          --build-number=${{ steps.bump.outputs.build_number }}

      - name: Embed browser extensions in Release bundle
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$release/extension" | Out-Null
          Copy-Item -Recurse -Force extension/chrome "$release/extension/chrome"
          Copy-Item -Recurse -Force extension/firefox "$release/extension/firefox"

      - name: Prepare experimental gobird binaries
        shell: pwsh
        run: |
          $releaseBin = "build/windows/x64/runner/Release/bin"
          New-Item -ItemType Directory -Force -Path $releaseBin | Out-Null
          & ".\tool\prepare_gobird.ps1" -OutDir $releaseBin -RepoRoot "."
          Copy-Item -Recurse -Force "third_party/gobird" "$releaseBin/third_party/gobird"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $zip = "ModernDownloader-Windows-Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="${{ steps.bump.outputs.tag }}" "installer/setup.iss"

      - name: Package Chrome ZIP
        shell: pwsh
        run: |
          $zip = "modern_downloader_chrome.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Push-Location extension/chrome
          Compress-Archive -Path * -DestinationPath "../../$zip" -CompressionLevel Optimal
          Pop-Location

      - name: Package Firefox XPI
        shell: pwsh
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if (-not $env:WEB_EXT_API_KEY -or -not $env:WEB_EXT_API_SECRET) {
            Write-Host "AMO secrets not configured. Creating zip XPI package."
            Push-Location extension/firefox
            Compress-Archive -Path * -DestinationPath "../../modern_downloader_firefox.xpi" -CompressionLevel Optimal
            Pop-Location
          } else {
            npm install -g web-ext@8
            $artifacts = "signed-xpi"
            New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
            $signOutput = & web-ext sign `
              --source-dir extension/firefox `
              --api-key $env:WEB_EXT_API_KEY `
              --api-secret $env:WEB_EXT_API_SECRET `
              --channel unlisted `
              --artifacts-dir $artifacts 2>&1 | Out-String
            Write-Host $signOutput
            $signed = Get-ChildItem $artifacts -Filter *.xpi -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($signed) {
              Copy-Item $signed.FullName modern_downloader_firefox.xpi -Force
            } else {
              Push-Location extension/firefox
              Compress-Archive -Path * -DestinationPath "../../modern_downloader_firefox.xpi" -CompressionLevel Optimal
              Pop-Location
            }
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          $tag = "${{ steps.bump.outputs.tag }}"
          $files = @(
            "ModernDownloader-Windows-Portable.zip",
            "ModernDownloader-Setup-$tag.exe",
            "modern_downloader_firefox.xpi",
            "modern_downloader_chrome.zip"
          )
          $lines = foreach ($f in $files) {
            if (Test-Path $f) {
              $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              "$hash  $f"
            }
          }
          $lines | Set-Content -Encoding utf8 CHECKSUMS.txt

      - name: Commit version bump & Tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml \
            extension/shared/manifest.chrome.json \
            extension/shared/manifest.firefox.json \
            extension/chrome/manifest.json \
            extension/firefox/manifest.json \
            extension_version.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}" || true
          git tag "${{ steps.bump.outputs.tag }}" || true
          git push origin "HEAD:${{ github.ref_name }}" --tags || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            ModernDownloader-Windows-Portable.zip
            ModernDownloader-Setup-${{ steps.bump.outputs.tag }}.exe
            modern_downloader_firefox.xpi
            modern_downloader_chrome.zip
            CHECKSUMS.txt
            extension_version.json

